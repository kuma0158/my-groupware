name: Authentication and application checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q
  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    name: Chromium authentication E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Install Playwright
        run: |
          cd e2e
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Start isolated services and run E2E
        env:
          SECRET_KEY: github-e2e-test-key-at-least-thirty-two-characters
          FRONTEND_ORIGIN: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
          ALLOW_REGISTRATION: 'true'
          COOKIE_SECURE: 'false'
          APP_ENV: development
          CI: 'true'
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/coredesk-e2e.db"
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > "$RUNNER_TEMP/backend.log" 2>&1 &
          BACK_PID=$!
          (cd frontend && npm run dev -- --hostname 127.0.0.1 --port 3000) > "$RUNNER_TEMP/frontend.log" 2>&1 &
          FRONT_PID=$!
          trap 'kill $BACK_PID $FRONT_PID 2>/dev/null || true; tail -n 80 "$RUNNER_TEMP/backend.log"; tail -n 80 "$RUNNER_TEMP/frontend.log"' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          cd e2e
          npx playwright test
      - name: Upload E2E traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
